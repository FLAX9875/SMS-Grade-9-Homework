services:
  # Discord Bot Service
  - type: web
    name: homework-tracker-bot
    env: node
    plan: free
    buildCommand: cd Website-Bot-Homework/Website-Bot-Homework && npm install
    startCommand: cd Website-Bot-Homework/Website-Bot-Homework && node index.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: API_URL
        value: https://homework-tracker-server.onrender.com
      - key: WEBSITE_URL
        value: https://homework-tracker-client.onrender.com

  # Express Server Service  
  - type: web
    name: homework-tracker-server
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 5000
      - key: DISCORD_WEBHOOK_URL
        sync: false

  # Next.js Client Service
  - type: web
    name: homework-tracker-client
    env: node
    plan: free
    buildCommand: cd client && npm install && npm run build
    startCommand: cd client && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://homework-tracker-server.onrender.com
      - key: PORT
        value: 3000
